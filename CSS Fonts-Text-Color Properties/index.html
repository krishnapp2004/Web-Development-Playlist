<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Fonts-Text-Color Properties</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap');

        p {
            font-family: "Open Sans", sans-serif;
            font-style: italic;
            font-weight: bold;
            text-decoration: underline;
            font-size: 20px;
            line-height:4;
            text-decoration-thickness: 7px;
            text-indent: 30px;
        }
        h2{
            text-transform: capitalize;
            text-transform: lowercase;
            text-decoration: dotted;
            text-decoration: aqua;
            text-overflow: ellipsis;
            text-overflow: hidden;
            width:45px;
            word-break: break-all;
            text-align: center;
            
        }
    </style>
</head>
<body>
    <div>
        <h1>Fonts</h1>
        <h2>About fonts</h2>
        <p>This is about fonts</p>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Sequi, voluptates fugiat fugit libero vel praesentium enim error ducimus omnis tempora dolor, aspernatur corporis.</p>
    </div>
</body>
</html>
