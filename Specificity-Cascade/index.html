<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
CSS Specificity & Cascade</title>
<style>
    /* the specificity of this selector is 1 */
    h1{
        color:aqua;
    }
    /* the specificity of this selector is 10+1=11*/
    h1.yellow{
        color:yellow;
    }
    .cred{
        color:red;
    }
    .cpurple{
        color:purple;
    }
    /* the specificity of this selector is 10 */
    /* this is an example of attribute selector */
    [data-x=a]{
        color:maroon;
    }
</style>
</head>
<body>
    <div>
        <h1 class="yellow cred cpurple" data-x="a">
CSS Specificity</h1>
    </div>
</body>
</html>
